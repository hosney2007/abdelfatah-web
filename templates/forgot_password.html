
{% extends "base.html" %}

{% block body %}

<div class="admin-container">

    <h2 class="mb-4 text-center">Forgot Password</h2>

    <form method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label>Email Address</label>
            <input
                type="email"
                class="form-control"
                name="email"
                required
            >
        </div>

        <button class="btn btn-primary w-100">
            Send Reset Link
        </button>

    </form>

</div>

{% endblock %}
