{% extends 'base.html' %}



{% block body %}
<section class="booking-hero">
    <div class="overlay"></div>
    <div class="booking-content">
        <span>BOOK YOUR COURSE</span>
        <h1>Reserve Your Seat</h1>
        <p>
            Book your place in one of our SAT,ACT and EST courses.
            fill in your information and we'll contact you shortly.
        </p>
    </div>
</section>

<section class="booking-form-section">
    <div class="container">
        <form class="booking-form">    
            <div class="form-grid">
            <div class="input-box">
                <label>Student Name</label>
                <input type="text" placeholder="Enter student name" required>
            </div>
            <div class="input-box">
                <label> student Number</label>
                <input type="text" placeholder="Enter student number" required>
            </div>
            <div class="input-box">
                <label>parent Number</label>
                <input type="text" placeholder="Enter parent number" required>
            </div>
            <div class="input-box">
                <label>Student Grade</label>
                <select required>
                    <option value="">Select Grade</option>
                    <option> Grade 10</option>
                    <option>Grade 11</option>
                    <option>Grade 12</option>
                </select>
            </div>
            <div class="input-box">
                <label>Student Name</label>
                <select required>
                    <option value=""> Select course </option>
                    <option>SAT</option>
                    <option>EST</option>
                    <option>ACT</option>
                </select>
            </div>
        </div>
        <div class="study-mode">
            <label>Study Mode</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="mode" value="offline">
                    Offline
                </label>
                <label>
                    <input type="radio" name="mode" value="online">
                    Online
                </label>

            </div>
        

        </div>
        <div class="input-box" id="branch-box">
            <label>Branch</label>
            <select id="branch">
                <option value="">Select Branch</option>
                <option value="maadi">Maadi</option>
                <option value="newcairo">New cairo</option>
                <option value="nasr">Nasr City</option>   
            </select>
        </div>
        <div class="input-box" id="schadule-box">
            <label> Avalibale Groups</label>
            <select id="schadule">
                <option value=""> Choose Group</option>
            </select>

        </div>
        <div class="input-box full width">
            <label> Additional Notes</label>
            <textarea rows="6" placeholder="Write any additional notes..."></textarea>

        </div>
        <div class="submit-btn">
            <button type="submit">
                Book Now
            </button>

        </div>
       </form>

    </div>
</section>

{% endblock %}
